name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to build and publish
        required: true
        default: v0.2.0
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Verify tag version
        run: |
          VERSION="$(sed -n 's/^version: \([0-9.]\+\)\+.*/\1/p' pubspec.yaml)"
          test "v${VERSION}" = "$RELEASE_TAG"
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Get dependencies
        run: flutter pub get
      - name: Test and analyze
        run: |
          flutter test
          flutter analyze
      - name: Build Linux release
        run: flutter build linux --release
      - name: Package release tarball
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release/leenky
          cp -a build/linux/x64/release/bundle/. release/leenky/
          cp leenky.desktop assets/icon.png release/
          mv release/icon.png release/leenky.png
          tar czf "leenky-${VERSION}-linux-x86_64.tar.gz" -C release leenky leenky.desktop leenky.png
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: leenky-*-linux-x86_64.tar.gz
